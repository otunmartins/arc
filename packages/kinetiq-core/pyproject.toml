[project]
name = "kinetiq-core"
version = "0.1.0"
description = "KINETIQ biomechanics: preprocessing, joint angles and movement metrics from kq-skel-v1 keypoints"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14", "kinetiq-contracts"]

[tool.uv.sources]
kinetiq-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetiq_core"]
