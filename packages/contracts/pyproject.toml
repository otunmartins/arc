[project]
name = "kinetiq-contracts"
version = "0.1.0"
description = "KINETIQ keypoint contract: kq-skel-v1 skeleton, scan header and .kqk.gz codec"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetiq_contracts"]
